[pytest]
# ============== 用例发现 ==============
# 测试用例搜索根目录：testcases/
testpaths = testcases
# 用例文件匹配规则
python_files = test_*.py *_test.py
# 用例类匹配规则
python_classes = Test*
# 用例函数匹配规则
python_functions = test_*

# ============== 运行参数默认值 ==============
# -v 详细输出每个用例名 + PASSED/FAILED
# -s 不捕获 print / logger 输出，控制台直接打印请求日志
# --strict-markers 未注册的 marker 报错，避免笔误
# --disable-warnings 减少无关的 deprecation warning（可按需移除）
addopts = -v -s --strict-markers --html=reports/report.html --self-contained-html

# ============== 报告输出 ==============
# pytest-html 报告输出目录（同时在 addopts 中写死默认文件名，命令行覆盖优先级更高）
# --self-contained-html 生成单文件报告（资源内嵌，分享到其他电脑也能打开）

# ============== 编码 & 日志 ==============
# 统一 UTF-8，避免 Windows 控制台中文乱码
disable_test_id_escaping_and_forfeit_all_rights_to_encoding_support = False
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)7s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ============== 自定义 markers 注册 ==============
# 执行示例：pytest -m "p0" 仅跑 P0 用例；pytest -m "not slow" 跳过慢用例
markers =
    p0: P0 级用例 —— 主流程冒烟，阻塞性回归
    p1: P1 级用例 —— 常规功能，重要
    p2: P2 级用例 —— 边界/异常，非阻塞
    slow: 慢用例（超过 5s），每日回归可按需跳过
